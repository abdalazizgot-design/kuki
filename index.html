<div class="hero"><h1><span>The</span> <span>world</span> <span>model</span></h1><p>LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.</p></div>

</div>
<script>
(function(){
'use strict';
var stage=document.getElementById('stage'),controller=document.getElementById('controller'),statusEl=document.getElementById('status'),live=document.getElementById('live'),notice=document.getElementById('notice'),retry=document.getElementById('retry'),base=document.getElementById('vBase'),buttons=document.querySelectorAll('.cell[data-state]'),active=base,lock=false,token=0,current='base',pending=null,focusOrigin=null,hiddenAt=0,timer=null;
var states={scene:{forward:document.getElementById('vScene'),reverse:document.getElementById('vSceneR'),hold:.08,reverseHold:.18,label:'Scene'},light:{forward:document.getElementById('vLight'),reverse:document.getElementById('vLightR'),hold:.08,reverseHold:.08,label:'Lighting'},colorway:{forward:document.getElementById('vCloth'),reverse:base,hold:.08,reverseHold:.08,label:'Clothing'},fullLook:{forward:document.getElementById('vCast'),reverse:document.getElementById('vCastR'),hold:.08,reverseHold:.08,label:'Cast'}};
var ready={scene:false,light:false,colorway:false,fullLook:false}, failed=false;
function announce(s){live.textContent=s;statusEl.textContent=s}
function vis(v){if(active&&active!==v)active.classList.remove('visible');v.classList.add('visible');active=v}
function resetVideo(v){try{v.pause();v.currentTime=0}catch(e){}}
function frameReady(v){return v.readyState>=2}
function waitSeek(v,t){return new Promise(function(resolve,reject){if(t<=.001){resolve();return}var done=false;function ok(){if(done)return;done=true;v.removeEventListener('seeked',ok);resolve()}v.addEventListener('seeked',ok);try{v.currentTime=t}catch(e){reject(e)}setTimeout(function(){if(!done){done=true;v.removeEventListener('seeked',ok);reject(Error('seek timeout'))}},3000)})}
function firstFrame(v,my){return new Promise(function(resolve,reject){var done=false,deadline=performance.now()+12000,raf=0,playing=false;
function clean(){if(done)return;done=true;if(raf)cancelAnimationFrame(raf);v.removeEventListener('playing',onPlaying);clearTimeout(timer);resolve()}
function fail(){if(done)return;done=true;if(raf)cancelAnimationFrame(raf);v.removeEventListener('playing',onPlaying);clearTimeout(timer);reject(Error('first frame timeout'))}
function onPlaying(){playing=true;check()}
function check(){if(done||my!==token)return;if(frameReady(v)&&playing){if('requestVideoFrameCallback' in v){v.requestVideoFrameCallback(function(now,meta){if(done||my!==token)return;if(meta.mediaTime<=.5&&v.readyState>=2)clean();else raf=requestAnimationFrame(check)})}else{raf=requestAnimationFrame(function(){raf=requestAnimationFrame(function(){if(v.readyState>=2)clean();else check()})})}return}if(performance.now()>deadline){fail();return}raf=requestAnimationFrame(check)}
v.addEventListener('playing',onPlaying);if(frameReady(v))check();else raf=requestAnimationFrame(check)
})}
function playOnce(v,my){var p=v.play();return Promise.all([p,firstFrame(v,my)])}
function terminal(v,hold,my,commit){var duration=v.duration;if(!isFinite(duration))duration=0;var target=Math.max(0,duration-hold);function pause(){if(my!==token)return;try{v.pause();v.currentTime=target}catch(e){}commit()}
function tick(){if(my!==token)return;if(v.currentTime>=target){pause()}else requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function setChosen(btn,label){var cap=controller.querySelector('.capsule'),a=btn.getBoundingClientRect(),b=cap.getBoundingClientRect();var dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);btn.style.setProperty('--dx',dx+'px');btn.style.setProperty('--dy',dy+'px');btn.classList.add('chosen');btn.textContent=label}
function clearChosen(){var b=controller.querySelector('.chosen');if(b){b.classList.remove('chosen');b.style.removeProperty('--dx');b.style.removeProperty('--dy')}}
function disableAll(x){for(var i=0;i<buttons.length;i++){buttons[i].disabled=x;buttons[i].tabIndex=x?-1:0;buttons[i].setAttribute('aria-hidden',x?'true':'false')}}
function hideTitle(){setTimeout(function(){if(lock)stage.classList.add('title-hidden')},0)}
function showTitle(){stage.classList.remove('title-hidden')}
function collapse(btn){setChosen(btn,btn.textContent);controller.classList.add('collapsed')}
function selected(btn){controller.classList.remove('collapsed');controller.classList.add('selected');setChosen(btn,'Reset');btn.classList.add('reset');btn.disabled=false;btn.tabIndex=0;btn.removeAttribute('aria-hidden')}
function expand(){controller.classList.remove('selected');controller.classList.add('expanding');clearChosen();for(var i=0;i<buttons.length;i++){buttons[i].classList.remove('reset');buttons[i].textContent=states[buttons[i].getAttribute('data-state')].label}setTimeout(function(){controller.classList.remove('expanding')},1100)}
function resetFocus(btn){try{if(focusOrigin)btn.focus({preventScroll:true})}catch(e){}}
function forward(state,btn){if(lock||current!=='base'||!ready[state])return;lock=true;failed=false;notice.classList.remove('show');focusOrigin=document.activeElement===btn;token++;var my=token,s=states[state],v=s.forward;disableAll(true);btn.classList.add('chosen');collapse(btn);hideTitle();announce('Loading '+s.label);resetVideo(v);Promise.all([waitSeek(v,v.currentTime),new Promise(function(r){requestAnimationFrame(function(){r()})})]).then(function(){if(my!==token)throw Error('stale');return playOnce(v,my)}).then(function(){if(my!==token)throw Error('stale');vis(v);announce(s.label+' transition');terminal(v,s.hold,my,function(){if(my!==token)return;current=state;selected(btn);disableAll(true);btn.disabled=false;btn.tabIndex=0;btn.removeAttribute('aria-hidden');lock=false;resetFocus(btn);announce(s.label+' selected')})}).catch(function(e){if(my!==token)return;lock=false;controller.classList.remove('collapsed');clearChosen();disableAll(false);notice.classList.add('show');announce('Transition failed. Retry.');resetVideo(v)})}
function reverse(state,btn){if(lock||current==='base')return;lock=true;token++;var my=token,s=states[state],v=s.reverse;disableAll(true);btn.classList.remove('reset');btn.textContent='Reset';announce('Returning to base');resetVideo(v);playOnce(v,my).then(function(){if(my!==token)throw Error('stale');vis(v);terminal(v,s.reverseHold,my,function(){if(my!==token)return;vis(base);resetVideo(base);base.classList.add('visible');current='base';expand();showTitle();disableAll(false);lock=false;resetFocus(btn);announce('Base scene restored')})}).catch(function(){if(my!==token)return;lock=false;controller.classList.add('selected');disableAll(true);btn.disabled=false;btn.tabIndex=0;notice.classList.add('show');announce('Reset failed. Retry.')})}
for(var i=0;i<buttons.length;i++){(function(btn){btn.addEventListener('click',function(){var state=btn.getAttribute('data-state');if(current==='base')forward(state,btn);else if(current===state)reverse(state,btn)});btn.addEventListener('mouseenter',function(){if(window.innerWidth>700&&!lock){controller.style.setProperty('--cap-left',((+btn.parentNode.children.length?btn.cellIndex:0))+'%')}});})(buttons[i])}
controller.addEventListener('pointermove',function(e){var r=controller.getBoundingClientRect();controller.style.setProperty('--glass-x',((e.clientX-r.left)/r.width*100)+'%');controller.style.setProperty('--glass-y',((e.clientY-r.top)/r.height*100)+'%')});

function onMedia(v){v.addEventListener('loadeddata',function(){checkReady()});v.addEventListener('error',function(){failed=true;checkReady()})}
var vids=document.querySelectorAll('video');for(var j=0;j<vids.length;j++)onMedia(vids[j]);
function checkReady(){for(var k in states){ready[k]=frameReady(states[k].forward)&&frameReady(states[k].reverse)}var all=true;for(var z in ready)if(!ready[z])all=false;if(all)announce('Ready')}
for(var q=0;q<vids.length;q++)if(frameReady(vids[q])){}
base.addEventListener('loadeddata',function(){try{base.currentTime=0}catch(e){}base.pause();base.classList.add('visible');checkReady()});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(lock&&pending&&pending.pause)pending.pause()}else{if(lock&&pending&&pending.play)pending.play()}});checkReady();
})();
