<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEOX Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#07070b;color:#fff;font-family:system-ui,Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 80% 0,#6d28d933,transparent 32%),radial-gradient(circle at 10% 60%,#06b6d422,transparent 28%)}header{height:68px;border-bottom:1px solid #272631;background:#09090de8;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{font-size:21px;font-weight:950}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);font-style:normal;margin-left:8px;box-shadow:0 0 30px #8b5cf655}.badge{color:#a7a3b2;font-size:12px}.wrap{max-width:1250px;margin:auto;padding:24px;display:grid;grid-template-columns:210px 1fr 230px;gap:15px}.box{background:#111118e8;border:1px solid #282733;border-radius:18px;box-shadow:0 20px 60px #0005}.tools{padding:12px}.tools button{width:100%;text-align:right;background:transparent;border:1px solid transparent;color:#eee;padding:11px;border-radius:10px;margin-bottom:4px}.tools button:hover,.tools .on{background:#8b5cf615;border-color:#8b5cf633}.editor{overflow:hidden}.bar{height:55px;border-bottom:1px solid #292832;display:flex;align-items:center;justify-content:space-between;padding:8px}.bar button,.upload{border:1px solid #353341;background:#191922;color:#fff;border-radius:9px;padding:9px 12px}.primary{background:linear-gradient(135deg,#8b5cf6,#06b6d4)!important;border:0!important;font-weight:900}.drop{margin:14px;height:400px;border:1px dashed #555064;border-radius:15px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#1a1725,#0b0b10);overflow:hidden}.drop .icon{font-size:55px;width:105px;height:105px;display:grid;place-items:center;border-radius:28px;margin:auto;background:linear-gradient(135deg,#8b5cf6,#22d3ee);box-shadow:0 20px 60px #8b5cf655;animation:f 3s ease-in-out infinite}@keyframes f{50%{transform:translateY(-10px) rotate(3deg)}}.drop h2{margin:15px 0 5px}.muted{color:#8f8b9a;font-size:12px}.video{margin:14px;display:none;background:#000;border-radius:15px;overflow:hidden}.video video{width:100%;max-height:400px;display:block}.timeline{padding:0 14px 14px}.track{height:70px;border:1px solid #2c2a36;border-radius:10px;background:#0b0b10;padding:5px}.clip{height:100%;border-radius:7px;background:linear-gradient(90deg,#422080,#134e61);display:flex;align-items:center;padding:10px;font-size:11px;overflow:hidden;white-space:nowrap}.right{padding:15px}.right h3{margin-top:0}.field{margin:12px 0}.field label{display:block;color:#9995a4;font-size:11px;margin-bottom:6px}.field input,.field select{width:100%;background:#0b0b10;color:#fff;border:1px solid #2d2b37;border-radius:9px;padding:10px}.export{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff;font-weight:950;margin-top:12px}.progress{height:7px;background:#24222d;border-radius:9px;overflow:hidden;margin-top:12px;display:none}.progress i{display:block;width:0;height:100%;background:#22d3ee}.status{margin-top:12px;padding:10px;border:1px solid #292733;border-radius:9px;color:#9c98a8;font-size:11px}.download{display:none;width:100%;margin-top:9px;text-align:center;text-decoration:none;background:#fff;color:#111;padding:10px;border-radius:9px;font-weight:900}@media(max-width:900px){.wrap{grid-template-columns:1fr}.tools{display:flex;gap:5px;overflow:auto}.tools button{min-width:120px}.right{display:block}}@media(max-width:600px){.wrap{padding:10px}.badge{display:none}.drop{height:320px}}
</style></head><body><div class="app"><header><div class="brand"><i>✦</i>VEOX Studio</div><span class="badge">REAL VIDEO EDITOR · يعمل داخل المتصفح</span><button class="bar primary" onclick="pick()">رفع فيديو</button></header><main class="wrap">
<aside class="box tools"><button class="on">✂️ قص وتقسيم</button><button onclick="note('الترجمة AI ستكون المرحلة التالية')">📝 ترجمة AI</button><button onclick="note('تحسين الصوت سيكون المرحلة التالية')">🔊 تحسين الصوت</button><button onclick="note('التأثيرات ستكون المرحلة التالية')">✨ تأثيرات</button></aside>
<section class="box editor"><div class="bar"><div><button onclick="togglePlay()">▶ تشغيل</button> <button onclick="setMark()">✂ تحديد</button></div><button class="primary" onclick="pick()">＋ فيديو</button></div><div class="drop" id="drop"><div><div class="icon">▶</div><h2>ارفع فيديو وابدأ</h2><p class="muted">سيتم فتح الملف الحقيقي هنا بدون رفعه إلى أي سيرفر.</p><button class="upload" onclick="pick()">اختيار فيديو</button><p class="muted">MP4 / WebM / MOV</p></div></div><div class="video" id="videoBox"><video id="vid" controls></video></div><div class="timeline"><div class="track"><div class="clip" id="clip">لم يتم اختيار فيديو</div></div></div></section>
<aside class="box right"><h3>التصدير</h3><div class="field"><label>البداية بالثواني</label><input id="start" type="number" min="0" value="0"></div><div class="field"><label>النهاية بالثواني</label><input id="end" type="number" min="0" value="0"></div><div class="field"><label>المقاس</label><select><option>9:16 — Reels / TikTok</option><option>16:9 — YouTube</option><option>1:1 — Square</option></select></div><button class="export" onclick="exportVideo()">تصدير MP4 فعليًا</button><div class="progress" id="prog"><i id="bar"></i></div><div class="status" id="status">جاهز — لم يتم رفع ملف.</div><a id="download" class="download" download="veox-clip.webm">تحميل المقطع</a></aside>
</main></div><input id="file" type="file" accept="video/*" hidden><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script><script>
const input=document.getElementById('file'),vid=document.getElementById('vid');let file=null,ff=null;
function pick(){input.click()}input.onchange=()=>{file=input.files[0];if(!file)return;vid.src=URL.createObjectURL(file);document.getElementById('drop').style.display='none';document.getElementById('videoBox').style.display='block';document.getElementById('clip').textContent=file.name;vid.onloadedmetadata=()=>{document.getElementById('end').value=vid.duration.toFixed(2);status('جاهز لمعالجة '+(file.size/1048576).toFixed(1)+' MB')}}
function status(t){document.getElementById('status').textContent=t}function note(t){status(t)}function togglePlay(){if(!vid.src)return note('ارفع فيديو أولًا');vid.paused?vid.play():vid.pause()}function setMark(){if(vid.src){document.getElementById('start').value=vid.currentTime.toFixed(2);note('تم وضع نقطة البداية عند '+vid.currentTime.toFixed(2)+' ثانية')}}
async function exportVideo(){if(!file)return note('ارفع فيديو أولًا');const s=Math.max(0,+start.value||0),e=Math.min(vid.duration,+end.value||vid.duration);if(e<=s)return note('وقت النهاية يجب أن يكون أكبر من البداية');if(!window.FFmpeg)return note('محرك التصدير لم يتحمل بعد — أعد تحميل الصفحة');try{document.getElementById('prog').style.display='block';bar.style.width='5%';status('تحميل محرك معالجة الفيديو...');if(!ff)ff=FFmpeg.createFFmpeg({log:false,corePath:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.5/dist/ffmpeg-core.js',progress:p=>bar.style.width=Math.max(5,Math.round(p.ratio*100))+'%'});if(!ff.isLoaded())await ff.load();bar.style.width='25%';status('جاري قص الفيديو فعليًا...');ff.FS('writeFile',file.name,new Uint8Array(await file.arrayBuffer()));await ff.run('-ss',String(s),'-i',file.name,'-t',String(e-s),'-c','copy','out.mp4');const data=ff.FS('readFile','out.mp4');const blob=new Blob([data.buffer],{type:'video/mp4'});const url=URL.createObjectURL(blob);download.href=url;download.style.display='block';bar.style.width='100%';status('تم التصدير فعليًا — الملف جاهز للتحميل');}catch(err){console.error(err);status('تعذر التصدير لهذا الملف. جرّب MP4 أصغر.')}}
</script></body></html>
