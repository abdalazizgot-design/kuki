<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEOX Studio — محرر فيديو AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080d;color:#f7f5ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer}
:root{--violet:#8b5cf6;--cyan:#22d3ee;--panel:#111119;--line:#252532;--muted:#8e8b9c}
.app{min-height:100vh;background:radial-gradient(circle at 80% 0,#3d1d7140,transparent 35%),radial-gradient(circle at 10% 40%,#07598525,transparent 30%),#08080d}
.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#09090eee;backdrop-filter:blur(20px);position:sticky;top:0;z-index:20}.brand{font-size:22px;font-weight:950;display:flex;gap:10px;align-items:center}.orb{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 0 30px #8b5cf677;display:grid;place-items:center}.nav span{color:var(--muted);font-size:12px}.pro{background:#fff;color:#111;border:0;border-radius:10px;padding:9px 14px;font-weight:900}
.workspace{max-width:1400px;margin:auto;padding:22px;display:grid;grid-template-columns:240px 1fr 270px;gap:16px}.panel{background:#101018dd;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0005;overflow:hidden}.side{padding:14px}.side h4{color:var(--muted);font-size:11px;margin:8px 8px 12px}.tool{width:100%;background:transparent;border:1px solid transparent;color:#e9e6f4;padding:12px;border-radius:11px;text-align:right;margin:3px 0}.tool:hover,.tool.active{background:#8b5cf615;border-color:#8b5cf633}.tool b{display:block}.tool small{color:var(--muted)}
.stage{min-width:0}.toolbar{height:54px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.toolbar button{background:#171720;color:#ddd;border:1px solid var(--line);border-radius:9px;padding:7px 11px}.toolbar .main{background:linear-gradient(135deg,var(--violet),#6d4cff);border:0;color:#fff;font-weight:900}
.drop{min-height:470px;margin:14px;display:grid;place-items:center;border:1px dashed #514c62;border-radius:16px;background:radial-gradient(circle,#171522,#0c0c12);position:relative;overflow:hidden}.drop:before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:linear-gradient(135deg,#8b5cf633,#22d3ee22);filter:blur(25px)}.empty{text-align:center;position:relative}.empty .cube{width:92px;height:92px;margin:auto;border-radius:24px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-size:42px;box-shadow:0 25px 70px #8b5cf655;transform:perspective(500px) rotateX(10deg) rotateY(-12deg);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:perspective(500px) rotateX(-5deg) rotateY(10deg) translateY(-8px)}}.empty h2{margin:18px 0 6px}.empty p{color:var(--muted);font-size:13px}.upload{background:#fff;color:#111;border:0;border-radius:11px;padding:12px 18px;font-weight:950;margin-top:7px}.hint{font-size:11px;color:#666475!important}
video{display:none;width:100%;max-height:470px;object-fit:contain;background:#000}.videoWrap{margin:14px;border-radius:16px;overflow:hidden;background:#000;display:none}.videoWrap video{display:block}
.timeline{margin:14px}.track{height:78px;background:#0b0b10;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}.clip{height:100%;background:linear-gradient(90deg,#38206b,#173e55);border:1px solid #8b5cf688;border-radius:9px;display:flex;align-items:center;padding:8px;gap:8px}.clip i{width:4px;height:45px;background:#fff;border-radius:4px;opacity:.4}.clip span{font-size:11px}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:6px}
.right{padding:15px}.right h3{font-size:14px;margin:4px 0 14px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.field input,.field select{width:100%;background:#0b0b10;border:1px solid var(--line);color:#fff;padding:10px;border-radius:9px;outline:none}.export{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--violet),var(--cyan));border:0;color:#fff;border-radius:11px;padding:13px;font-weight:950;box-shadow:0 12px 35px #8b5cf633}
.status{font-size:11px;color:var(--muted);padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.status b{color:#7ee2b1}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:10px;font-weight:800;display:none;z-index:99}
@media(max-width:1000px){.workspace{grid-template-columns:190px 1fr}.right{display:none}}@media(max-width:650px){.workspace{display:block;padding:10px}.side{display:flex;overflow:auto;gap:5px}.side h4{display:none}.tool{min-width:105px}.drop{min-height:360px}.nav{padding:0 12px}}
</style></head>
<body><div class="app">
<nav class="nav"><div class="brand"><span class="orb">✦</span>VEOX <span>STUDIO</span></div><span>AI Video Editor · 3D Workspace</span><button class="pro" onclick="toast('نظام الاشتراك سيتم ربطه بعد تجهيز Backend')">PRO</button></nav>
<div class="workspace">
<aside class="panel side"><h4>الأدوات</h4><button class="tool active" onclick="setTool(this)">✂️ <b>قص الفيديو</b><small>Trim & Split</small></button><button class="tool" onclick="setTool(this);toast('الترجمة التلقائية ستعمل مع محرك AI')">📝 <b>ترجمة AI</b><small>Auto Captions</small></button><button class="tool" onclick="setTool(this);toast('تحسين الصوت جاهز للربط بمحرك الصوت')">🔊 <b>تحسين الصوت</b><small>Audio Enhance</small></button><button class="tool" onclick="setTool(this)">🎨 <b>التأثيرات</b><small>Effects</small></button><button class="tool" onclick="setTool(this)">📐 <b>تغيير المقاس</b><small>9:16 · 1:1 · 16:9</small></button></aside>
<main class="panel stage"><div class="toolbar"><div><button onclick="playPause()">▶ تشغيل</button> <button onclick="toast('تم تحديد نقطة القص')">✂ قص</button></div><button class="main" onclick="document.getElementById('file').click()">＋ إضافة فيديو</button></div>
<div class="drop" id="drop"><div class="empty"><div class="cube">▶</div><h2>ابدأ مشروعك</h2><p>ارفع فيديو حقيقي وسنفتحه داخل المحرر</p><button class="upload" onclick="document.getElementById('file').click()">رفع فيديو</button><p class="hint">MP4 · WebM · MOV · المعالجة المحلية في المتصفح</p></div></div>
<div class="videoWrap" id="videoWrap"><video id="video" controls></video></div>
<div class="timeline"><div class="track" id="track"><div class="clip" id="clip"><i></i><span id="clipName">لم يتم رفع فيديو</span></div></div><div class="time"><span>00:00</span><span id="duration">00:00</span></div></div>
</main>
<aside class="panel right"><h3>إعدادات المشروع</h3><div class="field"><label>المقاس</label><select id="ratio"><option>9:16 — TikTok / Reels</option><option>16:9 — YouTube</option><option>1:1 — Square</option></select></div><div class="field"><label>بداية القص (ثانية)</label><input id="start" type="number" min="0" value="0"></div><div class="field"><label>نهاية القص (ثانية)</label><input id="end" type="number" min="0" value="0"></div><button class="export" onclick="exportClip()">تصدير المقطع ✦</button><div class="status">الحالة: <b id="state">جاهز</b><br><span id="fileInfo">لم يتم رفع ملف</span></div></aside>
</div></div>
<input id="file" type="file" accept="video/*" hidden>
<div class="toast" id="toast"></div>
<script>
let video=document.getElementById('video'),fileUrl=null;
const fileInput=document.getElementById('file');
fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;if(fileUrl)URL.revokeObjectURL(fileUrl);fileUrl=URL.createObjectURL(f);video.src=fileUrl;document.getElementById('drop').style.display='none';document.getElementById('videoWrap').style.display='block';document.getElementById('clipName').textContent=f.name;document.getElementById('fileInfo').textContent=(f.size/1024/1024).toFixed(1)+' MB · '+f.type;video.onloadedmetadata=()=>{document.getElementById('duration').textContent=fmt(video.duration);document.getElementById('end').value=Math.floor(video.duration*100)/100;};toast('تم تحميل الفيديو الحقيقي');};
function fmt(s){return isFinite(s)?Math.floor(s/60).toString().padStart(2,'0')+':'+Math.floor(s%60).toString().padStart(2,'0'):'00:00'}
function playPause(){if(!video.src)return toast('ارفع فيديو أولًا');video.paused?video.play():video.pause()}
function setTool(el){document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function exportClip(){if(!video.src)return toast('ارفع فيديو أولًا');const s=Math.max(0,+document.getElementById('start').value||0),e=Math.min(video.duration,+document.getElementById('end').value||video.duration);if(e<=s)return toast('تأكد من وقت البداية والنهاية');video.currentTime=s;video.play();document.getElementById('state').textContent='معاينة القص';const stop=()=>{if(video.currentTime>=e){video.pause();video.removeEventListener('timeupdate',stop);document.getElementById('state').textContent='تم تحديد المقطع';toast('تم قص المقطع للمعاينة. التصدير النهائي يحتاج محرك FFmpeg في الخادم.')}};video.addEventListener('timeupdate',stop)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2600)}
</script></body></html>
